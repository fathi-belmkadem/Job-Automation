{{- if .Values.join.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: join-dashboard
  labels: {{ include "job-automation.labels" (dict "name" "join" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.join.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: join
  template:
    metadata:
      labels: {{ include "job-automation.labels" (dict "name" "join" "Release" .Release) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: join
          image: {{ include "job-automation.image" (dict "root" $ "repository" .Values.join.image.repository) }}
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: {{ .Values.join.secretName }}
          env:
            - name: LATEX_COMPILER_URL
              value: "http://latex-compiler:5000"
          volumeMounts:
            - name: workspace
              mountPath: /app/output
            - name: session
              mountPath: /app/config/session.json
              subPath: session.json
              readOnly: true
            - name: personal-info
              mountPath: /app/config/personal_info.txt
              subPath: personal_info.txt
              readOnly: true
          resources: {{ toYaml .Values.join.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: join-workspace
        - name: session
          secret:
            secretName: {{ .Values.join.sessionSecretName }}
        - name: personal-info
          secret:
            secretName: {{ .Values.join.personalInfoSecretName }}
{{- end }}
